[project]
name = "qa-for-me"
version = "0.1.0"
description = "Personal Q&A API built with LangGraph and LangChain."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "langchain>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.3",
    "langchain-chroma>=0.2",
    "langgraph>=0.2",
    "pydantic-settings>=2.6",
    "streamlit>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "ml*"]

[tool.pytest.ini_options]
pythonpath = ["."]
