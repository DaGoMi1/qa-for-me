services:
  api:
    build: .
    env_file:
      - .env
    volumes:
      - chroma_data:/app/data/chroma
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build: .
    command: >
      streamlit run frontend/streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501
      --browser.gatherUsageStats false
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:
